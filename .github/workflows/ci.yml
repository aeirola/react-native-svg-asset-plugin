name: CI
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macOS-latest, windows-latest]
        node_version: [16]
        metro_version: ['0.62.0']
    name: Test ${{ matrix.os }} node${{ matrix.node_version }} metro${{ matrix.metro_version }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node_version }}
      - run: npm ci
      - run: npm install --dev --no-save metro@${{ matrix.metro_version }}
      - run: npm test
      - uses: actions/upload-artifact@v5
        with:
          name: integration-test-png-cache-${{ matrix.os }}-node${{ matrix.node_version }}-metro${{ matrix.metro_version }}
          path: integration_tests/bundles/images/.png-cache/
          include-hidden-files: true

  publish:
    needs: test
    runs-on: ubuntu-latest
    name: Publish
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 16
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - if: github.event_name != 'push' || !startsWith(github.event.ref, 'refs/tags')
        run: npm publish --dry-run
      - if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
